

<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Calendario de Adviento</title>

<style>

*{box-sizing:border-box}

body{

  margin:0;

  background:#f7eee5;

  color:#653d35;

  font-family:Georgia,serif;

}

#app{

  width:min(100%,760px);

  margin:auto;

  padding:12px;

}

.view{display:none}

.view.active{display:block}

.art{

  display:block;

  width:100%;

  height:auto;

  object-fit:contain;

  border-radius:14px;

}

#closedView,#openView{cursor:pointer}

.calendar-wrap{

  position:relative;

  width:100%;

  line-height:0;

}

#calendarArt{

  display:block;

  width:100%;

  height:auto;

  border-radius:14px;

}

/* Zonas invisibles encima de los 24 dibujos */

.hotspots{

  position:absolute;

  left:8%;

  right:8%;

  top:2%;

  bottom:5%;

  display:grid;

  grid-template-columns:repeat(4,1fr);

  grid-template-rows:repeat(6,1fr);

  column-gap:2%;

  row-gap:1.5%;

}

.hotspot{

  border:0;

  padding:0;

  margin:0;

  background:transparent;

  border-radius:12px;

  cursor:pointer;

  min-width:0;

  min-height:0;

}

.hotspot:disabled{

  cursor:not-allowed;

}

.hotspot:not(:disabled):active{

  background:#ffffff30;

  outline:2px solid #ffffff70;

}

.back{

  display:block;

  margin:16px auto;

  border:0;

  border-radius:22px;

  background:#9d4b35;

  color:white;

  padding:12px 24px;

  font-size:15px;

}

.modal{

  display:none;

  position:fixed;

  inset:0;

  z-index:5;

  background:#24150edb;

  align-items:center;

  justify-content:center;

  padding:18px;

}

.modal.show{display:flex}

.modal-card{

  background:#fff4e5;

  border:3px solid #bd8b59;

  border-radius:18px;

  padding:25px 20px;

  text-align:center;

  width:min(100%,430px);

  box-shadow:0 8px 30px #0005;

}

.modal-card h2{

  color:#9c432f;

  margin-top:0;

}

.modal-card p{

  font-size:18px;

  line-height:1.5;

}

.valid{

  font-size:13px!important;

  color:#8b6b55;

  margin-top:22px;

}

.close{

  background:#9d4b35;

  color:white;

  border:0;

  border-radius:20px;

  padding:10px 25px;

  font-size:15px;

}

</style>

</head>

<body>

<div id="app">

<section id="closedView" class="view active"

         onclick="showView('openView')">

  <img class="art"

       src="BD81608E-A032-415E-BCD4-685DCC8AA317.png"

       alt="Tienda navideña cerrada">

</section>

<section id="openView" class="view"

         onclick="showView('calendarView')">

  <img class="art"

       src="3B81A37C-A0EF-4BF2-B79D-326B49DA0179.png"

       alt="Tienda navideña abierta">

</section>

<section id="calendarView" class="view">

  <div class="calendar-wrap">

    <img id="calendarArt"

         src="0BF2B8C7-9C39-4348-8F6A-F63BF7E3CD06.png"

         alt="Calendario de Adviento">

    <div class="hotspots" id="hotspots"></div>

  </div>

  <button class="back" onclick="showView('openView')">

    Volver a la tienda

  </button>

</section>

</div>

<div class="modal" id="modal"

     onclick="if(event.target===this)closeModal()">

  <div class="modal-card">

    <h2 id="giftTitle"></h2>

    <p id="giftText"></p>

    <p class="valid">Canjeable hasta el 31/12/27</p>

    <button class="close" onclick="closeModal()">Cerrar</button>

  </div>

</div>

<script>

const gifts = [

["Tarde de spa y skincare en casa","Hoy toca cuidarnos: mascarillas, skincare, mimos y una tarde para desconectar juntos."],

["Tarde de manta y película de Marvel","¿Y si hoy no hacemos demasiado? Manta, sofá y una peli de Marvel de las que tú quieras."],

["Cocinar un postre juntos","Elegimos una receta dulce, nos ponemos manos a la obra y luego toca probar el resultado."],

["Merienda de churros con chocolate","Hoy te invito yo, tú solo tienes que venir con hambre."],

["Noche de misterio: investigar y resolver un crimen juntos","Una víctima, varios sospechosos y un montón de pistas. Esta noche nos convertimos en detectives. A ver si conseguimos descubrir al culpable antes de acusar a medio mundo."],

["Ir a patinar sobre hielo","Una tarde de patinaje sobre hielo. Prometo intentar no acabar más tiempo en el suelo que patinando."],

["Tarde de juegos de mesa","Una tarde de juegos, piques y competición. Que gane el mejor… aunque ya veremos si aceptamos la derrota."],

["Masaje de espalda","Vale por un masaje de espalda en condiciones. Esta noche tus únicas preocupaciones serán elegir la postura y no quedarte dormido."],

["Tarde de fotos para reírse y pasárselo bien","Salimos a hacer fotos juntos, sin vergüenza y con permiso para hacer el ridículo."],

["Día del SÍ A TODO","Tienes 24 horas para elegir lo que quieras hacer. Yo no puedo quejarme, protestar ni poner pegas. Hoy mandas tú."],

["Noche de cubatas y Guatoca en casa","Esta noche montamos nuestra propia fiesta en casa: cubatas, Guatoca, música y a ver quién acaba haciendo más el ridículo."],

["Cita de los colores","Salimos a pasear. Cada uno elige un color y tiene que fotografiar todo lo que encuentre de ese color."],

["Cita low cost","Una cita sin gastar apenas dinero. El plan es nuestro y lo importante es pasarlo bien."],

["Ir al cine","Tú eliges la película y yo invito. Esta vez te toca escoger a ti, aunque espero que tengas buen gusto."],

["Ver tiendas de Navidad","Una tarde para pasear, ver las decoraciones y empaparnos del ambiente navideño."],

["Cita de supermercado","Cada uno elige algunas cosas en el supermercado y después decidimos qué cena podemos preparar con nuestra compra."],

["Tarde de figuras de plastilina","Nos ponemos creativos y hacemos figuras de plastilina. El jurado decidirá quién tiene más talento."],

["Ruta de senderismo","Nos vamos de ruta, disfrutamos del paisaje y hacemos una pequeña escapada juntos."],

["Aprender a hacer sushi juntos","Preparamos sushi desde cero y después nos lo comemos juntos con una sangría."],

["Comida en Yakitoro","Tenemos una comida pendiente en Yakitoro. Esta vez invito yo."],

["Recrear nuestra primera cita","Imagina que hoy nos conocemos por primera vez. Volvemos a tener nuestra primera cita, pero esta vez sin saber cómo acaba la historia."],

["Noche de videojuegos","Torneo de videojuegos entre los dos. Habrá competición, piques y un ganador que tendrá que presumir."],

["Construir algo juntos","Elegimos entre LEGO, una maqueta o un puzzle y construimos algo entre los dos."],

["Dormir en un sitio diferente","Una noche fuera de casa, en un sitio especial y diferente. Esta vez cambiamos nuestra cama por una experiencia de esas que apetece recordar."]

];

function showView(id){

  document.querySelectorAll(".view").forEach(v=>{

    v.classList.remove("active");

  });

  document.getElementById(id).classList.add("active");

  window.scrollTo({top:0,behavior:"smooth"});

}

function isUnlocked(day){

  if(new URLSearchParams(location.search).has("test")){

    return true;

  }

  const now=new Date();

  const madrid=new Date(

    now.toLocaleString("en-US",{timeZone:"Europe/Madrid"})

  );

  const unlock=new Date(2026,11,day);

  return madrid>=unlock;

}

function openGift(day){

  if(!isUnlocked(day))return;

  document.getElementById("giftTitle").textContent=

    gifts[day-1][0];

  document.getElementById("giftText").textContent=

    gifts[day-1][1];

  document.getElementById("modal").classList.add("show");

}

function closeModal(){

  document.getElementById("modal").classList.remove("show");

}

const hotspots=document.getElementById("hotspots");

gifts.forEach((gift,index)=>{

  const day=index+1;

  const button=document.createElement("button");

  button.className="hotspot";

  button.type="button";

  button.setAttribute("aria-label","Día "+day);

  button.disabled=!isUnlocked(day);

  button.addEventListener("click",()=>openGift(day));

  hotspots.appendChild(button);

});

</script>

</body>

</html>
