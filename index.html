

<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Calendario de Adviento</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:#f7eee5;color:#653d35;font-family:Georgia,serif}

#app{width:min(100%,760px);margin:auto;padding:12px}

.view{display:none}

.view.active{display:block}

.art{display:block;width:100%;height:auto;object-fit:contain;border-radius:14px}

#closedView,#openView{cursor:pointer}

.hint{text-align:center;font:14px system-ui,sans-serif;color:#78574e}

#calendarView{padding:4px 0 18px}

#calendarArt{width:100%;max-height:78vh;object-fit:contain}

#days{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:14px auto;max-width:560px}

.day{min-height:58px;border:2px solid #b84b4b;border-radius:13px;background:#fff8ef;color:#a33b3d;font:bold 23px Georgia,serif;cursor:pointer}

.day:disabled{background:#e8ddd4;color:#9b8980;border-color:#c9b8ad;cursor:not-allowed}

#back{display:block;margin:12px auto;padding:12px 22px;border:0;border-radius:24px;background:#a83f40;color:white;font-size:15px}

#modal{display:none;position:fixed;inset:0;background:#241612bb;z-index:10;align-items:center;justify-content:center;padding:18px}

#modal.show{display:flex}

#card{width:min(100%,420px);background:#fff7ed;border:3px solid #c96c61;border-radius:20px;padding:24px 20px;text-align:center}

#card h2{margin:0 0 14px;color:#a83f40;font-size:25px}

#card p{font-size:18px;line-height:1.5}

#expiry{font:14px system-ui,sans-serif;color:#8d6b5e;margin-top:20px}

#closeCard{margin-top:8px;border:0;border-radius:22px;background:#a83f40;color:white;padding:10px 24px;font-size:15px}

@media(max-width:420px){#app{padding:8px}#days{gap:6px}.day{min-height:52px;font-size:21px}}

</style>

</head>

<body>

<main id="app">

<section id="closedView" class="view active" onclick="showOpen()">

<img class="art" src="8D7854A3-A032-415E-BCD4-685DCC8AA317.png" alt="Tienda navideña cerrada">

</section>

<section id="openView" class="view" onclick="showCalendar()">

<img class="art" src="BD81608E-A032-415E-BCD4-685DCC8AA317.png" alt="Tienda navideña abierta">

<p class="hint">Toca para entrar</p>

</section>

<section id="calendarView" class="view">

<img id="calendarArt" class="art" src="BA6DBF78-1A79-4C8D-A5F3-5DD434879647.png" alt="Calendario de Adviento">

<div id="days"></div>

<button id="back" onclick="showClosed()">Volver a la tienda</button>

</section>

</main>

<div id="modal" onclick="closeOnBackdrop(event)">

<div id="card">

<h2 id="title"></h2>

<p id="description"></p>

<p id="expiry">Canjeable hasta el 31/12/27</p>

<button id="closeCard" onclick="closeGift()">Cerrar</button>

</div>

</div>
